<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Karachi Public School - Student Results</title>
<style>
  :root{--green:#153a22;--green-2:#1f5a35;--black:#111111;--bg:#f2f5f3;--card:#ffffff;--muted:#5b6b61;--line:#dbe3de}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--black);min-height:100vh;padding:24px 14px}
  .wrap{max-width:700px;margin:0 auto}
  header{background:var(--card);border-radius:14px 14px 0 0;border-top:6px solid var(--green);box-shadow:0 6px 24px rgba(0,0,0,.08);text-align:center;padding:22px 18px 16px}
  header img{max-width:100%;width:440px;height:auto;display:block;margin:0 auto}
  .rule{height:2px;background:var(--black);margin:16px auto 14px;width:100%}
  header h1{color:var(--green);font-size:30px;letter-spacing:1px}
  header p{color:var(--muted);margin-top:6px;font-size:15px}
  .card{background:var(--card);border-radius:0 0 14px 14px;box-shadow:0 6px 24px rgba(0,0,0,.08);padding:22px}
  .search{display:flex;gap:10px;flex-wrap:wrap}
  .search input{flex:1;min-width:180px;padding:13px 14px;font-size:16px;border:2px solid var(--line);border-radius:10px;outline:none;color:var(--black)}
  .search input:focus{border-color:var(--green)}
  button{cursor:pointer;border:0;border-radius:10px;font-size:16px;font-weight:600;padding:13px 22px;background:var(--green);color:#fff}
  button:hover{background:var(--black)}
  button:disabled{opacity:.6;cursor:wait}
  .msg{margin-top:16px;padding:12px 14px;border-radius:10px;font-size:15px;display:none}
  .msg.error{display:block;background:#f1f1f1;color:var(--black);border-left:5px solid var(--black)}
  .msg.loading{display:block;background:#e6efe9;color:var(--green);border-left:5px solid var(--green)}
  #result{display:none;margin-top:20px}
  .res-head{text-align:center;border-bottom:2px solid var(--green);padding-bottom:12px;margin-bottom:14px}
  .res-head h2{color:var(--green)}
  .info{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;margin-bottom:16px}
  .info div span{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .info div b{font-size:16px}
  table{width:100%;border-collapse:collapse;margin-bottom:16px}
  th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line)}
  th{background:var(--green);color:#fff;font-size:13px;text-transform:uppercase;letter-spacing:.5px}
  td.num,th.num{text-align:right}
  .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
  .summary div{background:#f6f9f7;border:1px solid var(--line);border-radius:10px;padding:12px 6px}
  .summary span{display:block;font-size:12px;color:var(--muted);text-transform:uppercase}
  .summary b{font-size:20px}
  .badge{display:inline-block;padding:2px 16px;border-radius:20px;color:#fff;font-size:18px}
  .badge.Pass{background:var(--green)}
  .badge.Fail{background:var(--black)}
  .actions{margin-top:18px;text-align:center}
  .actions button{background:var(--black)}
  .actions button:hover{background:var(--green)}
  footer{text-align:center;color:var(--muted);font-size:13px;margin-top:18px}
  @media(max-width:480px){.info{grid-template-columns:1fr}.summary b{font-size:17px}header h1{font-size:24px}}
  @media print{body{background:#fff;padding:0}header p,.search,.actions,footer,.msg{display:none!important}header,.card{box-shadow:none}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>

  <div class="card">
    <div class="search">
      <input id="roll" type="text" placeholder="Roll Number (e.g. 1001)" autocomplete="off">
      <button id="btn" onclick="getResult()">Check Result</button>

<script>
  // ====== SETTINGS ======
  var API_URL = "https://script.google.com/macros/s/AKfycbxPSzW5H2HLx-NJ3N24krIpwFEufEesBgrqZtpSI4tQgoBMQfxGXYjGtQH2vEt_h-qQYA/exec";
  // Any column other than these is treated as a subject
  var INFO_FIELDS = ["RollNo", "Name", "FatherName", "Class"];
  var SUMMARY_FIELDS = ["Total", "Percentage", "Status"];
  // =======================

  var rollInput = document.getElementById("roll");
  var btn = document.getElementById("btn");
  var msg = document.getElementById("msg");
  var resultBox = document.getElementById("result");

  rollInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") getResult();
  });

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function showMsg(text, type) {
    msg.className = "msg " + type;
    msg.textContent = text;
  }

  function label(key) {
    return key.replace(/([a-z])([A-Z])/g, "$1 $2");
  }

  // Convert any server message to clear English
  function cleanMessage(m) {
    if (!m) return "No record found.";
    if (/koi record nahi/i.test(m)) return "No record found for this Roll Number.";
    if (/enter karein/i.test(m)) return "Please enter your Roll Number.";
    if (/nahi mil/i.test(m)) return "Result data is not available right now.";
    return "Something went wrong. Please try again.";
  }

  async function getResult() {
    var roll = rollInput.value.trim();
    resultBox.style.display = "none";
    if (!roll) { showMsg("Please enter your Roll Number.", "error"); return; }

    btn.disabled = true;
    showMsg("Searching for your result...", "loading");

    try {
      var res = await fetch(API_URL + "?roll=" + encodeURIComponent(roll));
      var json = await res.json();
      if (json.success) {
        msg.className = "msg";
        render(json.data);
      } else {
        showMsg(cleanMessage(json.message), "error");
      }
    } catch (err) {
      showMsg("Connection problem. Please check your internet and try again.", "error");
    }
    btn.disabled = false;
  }

  function render(d) {
    var info = "";
    INFO_FIELDS.forEach(function (k) {
      if (d[k] !== undefined) info += "<div><span>" + esc(label(k)) + "</span><b>" + esc(d[k]) + "</b></div>";
    });
    document.getElementById("info").innerHTML = info;

    var rows = "";
    Object.keys(d).forEach(function (k) {
      if (INFO_FIELDS.indexOf(k) === -1 && SUMMARY_FIELDS.indexOf(k) === -1) {
        rows += "<tr><td>" + esc(k) + "</td><td class='num'>" + esc(d[k]) + "</td></tr>";
      }
    });
    document.getElementById("subjects").innerHTML = rows;

    var sum = "";
    SUMMARY_FIELDS.forEach(function (k) {
      if (d[k] === undefined) return;
      var val = esc(d[k]);
      if (k === "Percentage") val += "%";
      var cls = k === "Status" ? " class='badge " + esc(d[k]) + "'" : "";
      sum += "<div><span>" + esc(k) + "</span><b" + cls + ">" + val + "</b></div>";
    });
    document.getElementById("summary").innerHTML = sum;

    resultBox.style.display = "block";
    resultBox.scrollIntoView({ behavior: "smooth", block: "start" });
  }
</script>
</body>
</html>
